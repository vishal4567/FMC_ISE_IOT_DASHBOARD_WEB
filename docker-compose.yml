name: iotdash

# Shared runtime env for every app container. `environment` overrides the
# localhost values in .env.prod so containers talk over the compose network
# (service names) instead of localhost.
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

# Shared config: one image (built once) runs web, worker, beat and estreamer.
x-app: &app
  build:
    context: .
  image: iotdash:latest
  env_file: [.env.prod]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    env_file: [.env.prod]        # supplies POSTGRES_DB / _USER / _PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-iotdash} -d $${POSTGRES_DB:-iotdash}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_INIT: "1"              # this container runs migrate + collectstatic
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8000),3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    environment: {<<: *app-env}
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]

  beat:
    <<: *app
    environment: {<<: *app-env}
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      web: {condition: service_started}
    restart: unless-stopped

  # ---- eStreamer ingestion (opt-in): docker compose --profile estreamer up -d
  # Runs eNcore + the ingester in one container (encore.sh | estreamer_ingest).
  # Needs client.pkcs12 and an estreamer.conf mounted (see DOCKER.md).
  estreamer:
    build:
      context: .
      dockerfile: docker/Dockerfile.encore
    image: iotdash-encore:latest
    profiles: ["estreamer"]
    env_file: [.env.prod]
    environment: {<<: *app-env}
    volumes:
      - ./client.pkcs12:/opt/eStreamer-eNcore/client.pkcs12:ro
      - ./deploy/estreamer.conf.example:/opt/eStreamer-eNcore/estreamer.conf:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:

