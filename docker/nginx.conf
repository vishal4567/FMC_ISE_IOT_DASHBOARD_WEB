upstream app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Terminate TLS here in production (mount certs + add a 443 server block).
    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WhiteNoise serves /static/ from the app; nginx just proxies. If you prefer
    # nginx to serve static directly, mount the collected staticfiles volume and
    # add a `location /static/ { alias /static/; }` block here.
}
