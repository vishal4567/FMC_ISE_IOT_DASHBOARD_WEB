{% extends "dashboard/base.html" %}
{% block title %}{{ dataset.label }}{% endblock %}

{% block content %}
<style>
  .dataset-card .card-header {
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:.5rem;
  }
  #data-table.dataset-table { border-collapse:separate; border-spacing:0; }
  .dataset-table thead th {
    position:sticky; top:0; z-index:2;
    background:var(--bs-tertiary-bg, #f1f3f5);
    border-bottom:2px solid var(--bs-border-color);
    text-transform:uppercase; font-size:.7rem; letter-spacing:.04em;
    color:var(--bs-secondary-color); white-space:nowrap; padding:.6rem .75rem;
  }
  .dataset-table tbody td { font-size:.86rem; padding:.55rem .75rem; vertical-align:middle; }
  .dataset-table tbody tr:hover > td { background:var(--bs-primary-bg-subtle); }
  .dataset-table tbody tr:not(:last-child) > td { border-bottom:1px solid var(--bs-border-color); }
  .cell-badge { font-weight:600; letter-spacing:.02em; }
  .dataTables_wrapper .dataTables_filter input { border-radius:20px; }
  .dataTables_wrapper .row:first-child { margin-bottom:.75rem; }
</style>

<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'dashboard:index' %}">Overview</a></li>
    <li class="breadcrumb-item active">{{ dataset.label }}</li>
  </ol>
</nav>

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <h3 class="mb-0 d-flex align-items-center gap-2">
    {{ dataset.label }}
    <span class="badge rounded-pill {% if dataset.source == 'ISE' %}bg-info{% elif dataset.source == 'MAP' %}bg-primary{% else %}bg-warning text-dark{% endif %}">
      {{ dataset.source }}
    </span>
  </h3>
  <div class="text-end">
    <a id="csv-link" href="{% url 'dashboard:dataset_csv' dataset.key %}" class="btn btn-sm btn-success">⬇ Export CSV</a>
    <button id="reload" class="btn btn-sm btn-outline-primary">↻ Reload</button>
    <div id="meta" class="small text-muted mt-1"></div>
  </div>
</div>

<!-- The page paints immediately; rows arrive from the JSON API below. -->
<div id="status" class="alert alert-secondary d-flex align-items-center">
  <span class="spinner-border spinner-border-sm me-2" role="status"></span>
  Loading data…
</div>

<div id="table-wrap" class="card shadow-sm dataset-card d-none">
  <div class="card-body">
    <div class="table-responsive">
      <table id="data-table" class="table table-hover align-middle w-100 mb-0 dataset-table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Server-side paginated. The dashboard filters (Site / Time / type / severity /
  // threats) ride in window.location.search; DataTables adds draw/start/length/
  // search on top, and the server returns just the requested page + counts.
  const BASE = "{% url 'dashboard:dataset_data' dataset.key %}";
  const FILTERS = window.location.search;   // e.g. ?site=..&range=..&type=..
  let dt = null;
  // don't pop up an alert on ajax/error; show it inline instead
  $.fn.dataTable.ext.errMode = 'none';

  function esc(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "object") v = JSON.stringify(v);
    return String(v).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // Pretty column header: device_mac -> "Device Mac"
  function pretty(k) {
    return esc(String(k).replace(/_/g, " ").replace(/\b\w/g, m => m.toUpperCase()));
  }

  // Richer cell rendering for well-known columns (badges), plain esc otherwise.
  const SEV = { critical:"danger", high:"warning", medium:"info",
                low:"secondary", informational:"secondary" };
  function cellRender(col, v) {
    const s = esc(v);
    if (v === null || v === undefined || v === "") return "";
    const c = String(col).toLowerCase();
    if (c === "severity") {
      const cls = SEV[String(v).toLowerCase()] || "secondary";
      return `<span class="badge text-bg-${cls} cell-badge">${s}</span>`;
    }
    if (c === "action") {
      const blocked = /block/i.test(String(v));
      return `<span class="badge ${blocked ? "text-bg-danger" : "text-bg-success"} cell-badge">${s}</span>`;
    }
    if (c === "quarantined") {
      const yes = v === true || String(v).toLowerCase() === "true" || String(v).toLowerCase() === "yes";
      return yes ? `<span class="badge text-bg-warning cell-badge">Yes</span>`
                 : `<span class="text-muted">No</span>`;
    }
    if (c === "event_type" || c === "device_type") {
      return `<span class="badge rounded-pill text-bg-light border">${s}</span>`;
    }
    if (c === "device_mac" || c === "mac" || c === "device_ip" || c === "ip"
        || c === "source_ip" || c === "dest_ip") {
      return `<span class="font-monospace small">${s}</span>`;
    }
    return s;
  }

  function initTable() {
    const $status = $("#status"), $wrap = $("#table-wrap");
    // preflight: discover columns (1 row) before initialising DataTables
    $.getJSON(BASE + FILTERS + (FILTERS ? "&" : "?") + "draw=0&start=0&length=1")
      .done(function (meta) {
        if (meta.error) {
          $status.removeClass("alert-secondary").addClass("alert-danger")
                 .text("Could not load: " + meta.error);
          return;
        }
        const cols = (meta.columns || []);
        if (!cols.length && !meta.recordsTotal) { $status.text("No records."); return; }
        $("#thead-row").html(cols.map(c => `<th>${pretty(c)}</th>`).join(""));
        $status.addClass("d-none");
        $wrap.removeClass("d-none");
        dt = $("#data-table").DataTable({
          serverSide: true, processing: true, order: [], searchDelay: 400,
          pageLength: 25, lengthMenu: [10, 25, 50, 100, ["10","25","50","100"]],
          ajax: {
            url: BASE,
            data: function (d) {
              // merge the dashboard filters into DataTables' params
              new URLSearchParams(FILTERS).forEach((v, k) => { d[k] = v; });
            },
            dataSrc: "data",
            error: function (xhr) {
              var msg = "";
              try { msg = (JSON.parse(xhr.responseText) || {}).error || ""; }
              catch (e) { msg = (xhr.responseText || "").replace(/<[^>]*>/g, " ").trim().slice(0, 400); }
              $("#status").removeClass("d-none alert-secondary").addClass("alert-danger")
                .html("<strong>Data load failed (HTTP " + xhr.status + ")</strong><br>" + esc(msg || "no response body"));
              $("#table-wrap").addClass("d-none");
            }
          },
          columns: cols.map(c => ({ data: c, title: pretty(c), defaultContent: "",
            render: function (v) { return cellRender(c, v); } })),
          language: {
            search: "", searchPlaceholder: "Search…", processing: "Loading…",
            info: "_START_–_END_ of _TOTAL_", infoEmpty: "0 records",
            lengthMenu: "Show _MENU_"
          }
        });
        dt.on('error.dt', function (e, settings, techNote, message) {
          $("#status").removeClass("d-none alert-secondary").addClass("alert-danger")
                      .text("Table error: " + (message || techNote));
        });
      })
      .fail(function (x) {
        $status.removeClass("alert-secondary").addClass("alert-danger")
               .text("Request failed (" + x.status + ").");
      });
  }

  $(function () {
    // carry the filters onto the CSV export too
    if (FILTERS) { var c = document.getElementById("csv-link"); c.href = c.href + FILTERS; }
    initTable();
    $("#reload").on("click", function () { if (dt) dt.ajax.reload(); });
  });
</script>
{% endblock %}
