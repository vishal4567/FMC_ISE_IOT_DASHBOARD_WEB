# HTTPS reverse proxy for the IoT Security Dashboard (required for Azure AD SSO:
# the OIDC redirect URI must be https://<FQDN>/auth/azure/callback/).
#
# 1) replace iotdash-uat.example.com with your real DNS name (Azure does NOT
#    accept a bare IP as a redirect URI),
# 2) point the two ssl_certificate lines at your cert + key,
# 3) install:  sudo cp deploy/nginx-iotdash-tls.conf /etc/nginx/conf.d/iotdash.conf
#    (remove the old deploy/nginx-iotdash.conf copy if it's also in conf.d),
# 4) sudo nginx -t && sudo systemctl reload nginx
#
# Static files are served by WhiteNoise (in gunicorn), so no /static/ alias is
# needed here (keeps SELinux simple).

upstream iotdash { server 127.0.0.1:8000; }

# ---- all HTTP -> HTTPS ----
server {
    listen 80;
    server_name iotdash-uat.example.com;        # <-- your FQDN
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    server_name iotdash-uat.example.com;         # <-- your FQDN
    client_max_body_size 10m;

    # cert = server cert + intermediate CA chain concatenated; key = private key
    ssl_certificate     /etc/pki/iotdash/iotdash.fullchain.crt;   # <-- edit
    ssl_certificate_key /etc/pki/iotdash/iotdash.key;             # <-- edit

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://iotdash;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django reads this as https
        proxy_read_timeout 120s;
    }
}
